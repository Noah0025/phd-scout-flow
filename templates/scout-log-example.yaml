# Example only. The AI may change this schema.
# Required idea: keep enough evidence to explain which keywords hit, which missed,
# and why each candidate passed or failed.

run:
  date: "YYYY-MM-DD"
  profile: "~/.phd-scout/profile.yaml"
  keywords: "~/.phd-scout/keywords.md"
  threshold_hint: 0.5   # 评估参考线（非硬过滤），与 profile.matching.threshold_hint 对应

keywords_used:
  a_level:
    - "[your_core_method]"
  b_level:
    - "[your_problem_domain]"
    - "[related_subproblem]"
  c_level:
    - "[too_broad_keyword]"

queries:
  - opportunity_type: "project_position"
    query: "PhD [your_core_method] [your_problem_domain] funded"
    source: "web"
    results_found: 8

candidates:
  - dedupe_key: "[normalized_title]__[normalized_institution]"
    title: "[phd_position_title]"
    institution: "[institution_name]"
    country: "[country]"
    opportunity_type: "project_position"
    url: "https://example.edu/phd-position"
    deadline: "YYYY-MM-DD"
    matched_keywords:
      a_level:
        - "[your_core_method]"
      b_level:
        - "[your_problem_domain]"
    missing_keywords:
      b_level:
        - "[related_subproblem]"
    evaluation:
      # 项目角度评估（Step 6）— job_signals 由 LLM 从 PhD 描述抽取
      job_signals: ["[signal_1]", "[signal_2]", "[signal_3]", "[signal_4]"]
      covered_signals: ["[signal_1]", "[signal_2]"]   # 用户关键词库覆盖到的
      match_rate: 0.50
      link_verified: true   # Step 5 cross-check 结果：true / "link_unverified"
    decision:
      status: "written_to_notion"
      priority: "B"
      reason: "direction matched; funding needs confirmation"
    notion:
      page_id: "[notion_page_id]"
      written: true

excluded:
  - title: "[excluded_title]"
    url: "https://example.edu/closed"
    reason: "deadline passed"

# 探测搜索发现的新源（来自 Step 3.6）。不自动加进 preferred_sources，
# 等 keyword-optimize 反馈循环里用户标"要" ≥3 次同一源后再建议加入。
discovered_sources:
  - domain: "[example-jobs-platform.org]"
    seen_count: 2          # 出现次数，N >= 2 才记录
    sample_urls:
      - "https://example-jobs-platform.org/phd-001"
      - "https://example-jobs-platform.org/phd-007"
    context: "通用查询 'PhD [a_level_keyword] 2026' 命中"
